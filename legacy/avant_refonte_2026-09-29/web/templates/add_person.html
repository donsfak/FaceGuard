{% extends "base.html" %}
{% block title %}Ajouter une personne — FaceGuard{% endblock %}

{% block content %}
<header class="page-header">
    <div>
        <h1>Ajouter une personne</h1>
        <p class="page-sub">La ré-indexation se lance automatiquement après l'ajout</p>
    </div>
</header>

<form method="POST" action="{{ url_for('people_add') }}" enctype="multipart/form-data" class="add-form">
    <label class="form-field">
        <span class="form-label">Nom</span>
        <input type="text" name="name" placeholder="ex : marie" required>
    </label>

    <label class="form-field">
        <span class="form-label">Photos</span>
        <input type="file" name="photos" accept="image/*" multiple required>
        <span class="form-hint">
            10 à 20 photos recommandées, avec un peu de variété (angle, éclairage, expression).
            Depuis un téléphone : prenez d'abord les photos avec l'appareil photo, puis sélectionnez-les ici.
        </span>
    </label>

    <div class="form-actions">
        <a href="{{ url_for('people_list') }}" class="btn btn-ghost">Annuler</a>
        <button type="submit" class="btn btn-primary">Ajouter et indexer</button>
    </div>
</form>
{% endblock %}
