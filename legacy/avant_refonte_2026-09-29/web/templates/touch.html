
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrôlement - Contrôle d'Accès IA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; padding: 40px; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1e293b; font-size: 22px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .btn { background-color: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn:hover { background-color: #1d4ed8; }
        .back-link { display: inline-block; margin-top: 15px; color: #64748b; text-decoration: none; }
        #message { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Enrôler une nouvelle personne</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nom complet :</label>
                <input type="text" id="name" name="name" required placeholder="Ex: Jean Kouadio">
            </div>
            <div class="form-group">
                <label for="file">Photo du visage (portrait clair) :</label>
                <input type="file" id="file" name="file" accept="image/*" required>
            </div>
            <button type="submit" class="btn">Enregistrer dans l'IA</button>
        </form>
        <p id="message"></p>
        <a href="/" class="back-link">← Retour au Dashboard</a>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.style.color = "#334155";
            message.innerText = "Traitement et extraction des features faciales en cours...";

            const formData = new FormData(form);

            try {
                const response = await fetch('/register-user', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok) {
                    message.style.color = "green";
                    message.innerText = result.message;
                    form.reset();
                } else {
                    message.style.color = "red";
                    message.innerText = "Erreur : " + result.detail;
                }
            } catch (err) {
                message.style.color = "red";
                message.innerText = "Erreur réseau : " + err.message;
            }
        });
    </script>
</body>
</html>
