<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232DD4BF' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3'/%3E%3Ccircle cx='12' cy='10' r='3'/%3E%3Cpath d='M7 17.5c1.2-1.9 3-2.9 5-2.9s3.8 1 5 2.9'/%3E%3C/svg%3E">
<title>{% block title %}FaceGuard — Contrôle d'accès IA{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=4">
{% block extra_css %}{% endblock %}
</head>
<body>
<!-- Icônes SVG (réutilisées via <use href="#i-...">) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><circle cx="12" cy="10" r="3"/><path d="M7 17.5c1.2-1.9 3-2.9 5-2.9s3.8 1 5 2.9"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c.8-3.6 3.6-6 7-6s6.2 2.4 7 6M19 8v6M16 11h6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c.8-3.6 3.6-6 7-6s6.2 2.4 7 6M16 4.2a4 4 0 0 1 0 7.6M18.5 15.3c1.9.8 3.1 2.7 3.5 5.7"/></symbol>
    <symbol id="i-switch" viewBox="0 0 24 24"><path d="M4 7h12l-3-3M20 17H8l3 3"/><path d="M4 7v3M20 17v-3"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 3v18M8 7l-5 5 5 5V7zM16 7l5 5-5 5V7z"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7.5 6.5H4a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-3.5z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
  </defs>
</svg>

<a class="skip-link" href="#main">Aller au contenu</a>
<div class="app-shell">
  <header class="mobile-topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-scan"/></svg></span>
      <span class="brand-name">FaceGuard</span>
    </a>
    <span class="system-status compact" role="status"><span class="status-dot"></span><span class="system-status-text">…</span></span>
  </header>
  <nav class="sidebar" aria-label="Navigation principale">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-scan"/></svg></span>
      <span class="brand-text">
        <span class="brand-name">FaceGuard</span>
        <span class="brand-sub">Contrôle d'accès IA</span>
      </span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}"><svg class="icon"><use href="#i-grid"/></svg><span>Tableau de bord</span></a>
      <a href="/scanner" class="nav-link {% block nav_scanner %}{% endblock %}"><svg class="icon"><use href="#i-scan"/></svg><span>Scanner</span></a>
      <a href="/register" class="nav-link {% block nav_register %}{% endblock %}"><svg class="icon"><use href="#i-user-plus"/></svg><span>Enrôler</span></a>
      <a href="/people" class="nav-link {% block nav_people %}{% endblock %}"><svg class="icon"><use href="#i-users"/></svg><span>Personnes</span></a>
    </div>
    <div class="system-status" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span class="system-status-text">Connexion au serveur…</span>
    </div>
  </nav>

  <main class="content" id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

<script src="/static/js/common.js?v=4"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
